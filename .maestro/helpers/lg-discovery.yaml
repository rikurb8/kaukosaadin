# LG connection setup check; excluded from suite discovery. No pairing or TV commands.
appId: fi.goodconsulting.kaukosaadin
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "No TVs added"
    commands:
      - tapOn: "Add TV"
- runFlow:
    when:
      visible: "TV settings"
    commands:
      - tapOn: "TV settings"
- assertVisible: "TV setup"
- extendedWaitUntil:
    visible: "(Found .* LG TV.*|No LG TVs replied.*|LG unreachable or timed out.*)"
    timeout: 15000
- assertVisible: "Find LG TVs"
- runFlow:
    when:
      visible: "Found .* LG TV.*"
    commands:
      - tapOn:
          text: '.* · [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'
      - assertVisible: 'Selected TV: [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'
      - scrollUntilVisible:
          element:
            text: "TV name"
          direction: DOWN
      - assertVisible: "TV name"
- scrollUntilVisible:
    element:
      text: "Manual address fallback"
    direction: UP
- tapOn: "Manual address fallback"
- assertVisible: "TV IPv4 address"
