# Unified LG + Apple TV scan check; excluded from suite discovery. Never taps a found device,
# so nothing is inspected, paired or sent.
appId: fi.goodconsulting.kaukosaadin
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "No devices added"
    commands:
      - tapOn: "Find devices"
- runFlow:
    when:
      visible: "Device settings"
    commands:
      - tapOn: ".* · (LG TV|Apple TV) ▾"
      - tapOn: "Add device…"
- assertVisible: "Add device"
- extendedWaitUntil:
    visible: "Scan again"
    timeout: 20000
- assertVisible: "Apple TV"
- assertVisible: "LG TV"
- assertVisible: "(.* · [0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+.*|No Apple TVs found.*|No LG TVs replied.*|.*scan failed.*)"
- scrollUntilVisible:
    element:
      text: "Enter LG TV address"
    direction: DOWN
- assertVisible: "Enter LG TV address"
