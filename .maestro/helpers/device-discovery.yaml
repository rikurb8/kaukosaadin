# Unified LG + Apple TV + Hue scan check; excluded from suite discovery. Never taps a found device,
# so nothing is inspected, paired or sent.
appId: fi.goodconsulting.kaukosaadin
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible: "No devices added"
    commands:
      - tapOn: "Find devices"
- runFlow:
    when:
      visible: "Device settings"
    commands:
      - tapOn: ".*▾"
      - tapOn: "Add a device"
- assertVisible: "Add a device"
- extendedWaitUntil:
    visible: "Scan again"
    timeout: 20000
- assertVisible: "(Found [0-9]+ new devices?|No (new )?devices found|Couldn't scan your network.*)"
- scrollUntilVisible:
    element:
      text: "Can't find your device\\?"
    direction: DOWN
- tapOn: "Can't find your device\\?"
- assertVisible: "Add by address"
- assertVisible: "IP address"
