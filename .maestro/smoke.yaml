# Covers both a fresh install and existing saved devices without erasing pairing.
# No pairing, wake or navigation; Add device only scans.
appId: fi.goodconsulting.kaukosaadin
tags:
  - smoke
---
- stopApp
- launchApp:
    clearState: false
- assertNotVisible: "Apple TV power"
- assertNotVisible: "SOURCE"
- runFlow:
    when:
      visible: "No devices added"
    commands:
      - assertNotVisible: "OK"
      - assertNotVisible: "Wake TV"
      - tapOn: "Find devices"
# An LG TV is never connected at launch, so its keys start disabled.
- runFlow:
    when:
      visible: "WEBOS"
    commands:
      - assertVisible:
          enabled: false
          containsChild:
            text: "OK"
      - assertVisible:
          text: "Up"
          enabled: false
      - assertVisible:
          enabled: false
          containsChild:
            text: "BACK"
- runFlow:
    when:
      visible: "Device settings"
    commands:
      - assertVisible: "(WEBOS|TVOS)"
      - tapOn: ".* · (LG TV|Apple TV) ▾"
      - tapOn: "Add device…"
- assertVisible: "Add device"
- assertVisible: "Enter LG TV address"
- tapOn:
    text: "Done"
    index: 0
- runFlow:
    when:
      visible: "No devices added"
    commands:
      - assertVisible: "Find devices"
      - assertNotVisible: "OK"
- runFlow:
    when:
      visible: "Device settings"
    commands:
      - assertVisible: "(WEBOS|TVOS)"
