# Covers both a fresh install and existing saved devices without erasing pairing.
# No pairing, wake or navigation; Add a device only scans.
appId: fi.goodconsulting.kaukosaadin
tags:
  - smoke
---
- stopApp
- launchApp:
    clearState: false
- assertNotVisible: "Apple TV power"
- assertNotVisible: "SOURCE"
- runFlow:
    when:
      visible: "Your home, one remote"
    commands:
      - assertNotVisible: "OK"
      - assertNotVisible: "Wake TV"
      - tapOn: "Find devices"
# An LG TV is never connected at launch, so its keys start disabled.
- runFlow:
    when:
      visible: "LG TV"
    commands:
      - assertVisible:
          enabled: false
          containsChild:
            text: "OK"
      - assertVisible:
          text: "Up"
          enabled: false
      - assertVisible:
          enabled: false
          containsChild:
            text: "BACK"
- runFlow:
    when:
      visible: "Device settings"
    commands:
      - assertVisible: "Choose device"
      - tapOn: "Choose device"
      - tapOn: "Add a device"
- assertVisible: "Let's find your devices"
- scrollUntilVisible:
    element:
      text: "Can't find your device\\?"
    direction: DOWN
- assertVisible: "Can't find your device\\?"
- scrollUntilVisible:
    element:
      text: "Close"
    direction: UP
- tapOn: "Close"
- runFlow:
    when:
      visible: "Your home, one remote"
    commands:
      - assertVisible: "Find devices"
      - assertNotVisible: "OK"
- runFlow:
    when:
      visible: "Device settings"
    commands:
      - assertVisible: "Choose device"
