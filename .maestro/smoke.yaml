# Covers both a fresh install and an existing saved TV without erasing pairing.
# No pairing, wake or navigation; setup only scans for LG advertisements.
appId: fi.goodconsulting.kaukosaadin
tags:
  - smoke
---
- stopApp
- launchApp:
    clearState: false
- assertNotVisible: "Apple TV power"
- assertNotVisible: "SOURCE"
- runFlow:
    when:
      visible: "No TVs added"
    commands:
      - assertNotVisible: "OK"
      - assertNotVisible: "Wake TV"
      - tapOn: "Add TV"
- runFlow:
    when:
      visible: "TV settings"
    commands:
      - assertVisible: "WEBOS"
      - assertVisible:
          enabled: false
          containsChild:
            text: "OK"
      - assertVisible:
          text: "Up"
          enabled: false
      - assertVisible:
          enabled: false
          containsChild:
            text: "BACK"
      - tapOn: "TV settings"
- assertVisible: "TV setup"
- assertVisible: "Find LG TVs"
- tapOn:
    text: "Done"
    index: 0
- runFlow:
    when:
      visible: "No TVs added"
    commands:
      - assertVisible: "Add TV"
      - assertNotVisible: "OK"
- runFlow:
    when:
      visible: "TV settings"
    commands:
      - assertVisible: "WEBOS"
      - assertVisible:
          enabled: false
          containsChild:
            text: "OK"
