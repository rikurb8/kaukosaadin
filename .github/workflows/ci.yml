name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The Dagger CLI version must satisfy engineVersion in
      # .dagger/modules/ci/dagger-module.toml.
      - uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "v1.0.0-beta.7"
          verb: check
          # Optional: a Dagger Cloud token adds traces and cross-run caching.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
